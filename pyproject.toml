[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostpath"
version = "2.0.0a4"
description = "Local-first Linux privacy diagnostics and offline defensive cybersecurity labs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "GhostPath contributors"}]
keywords = ["linux", "privacy", "security", "tor", "education"]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7,<7"]
dev = ["ruff>=0.6", "build>=1.2"]

[project.scripts]
ghostpath = "ghostpath.cli:main"
ghostpath-gui = "ghostpath.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
