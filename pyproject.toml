[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostpath"
version = "2.0.0a1"
description = "Local-first, read-only Linux privacy and defensive security diagnostics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "GhostPath contributors"}]
keywords = ["linux", "privacy", "security", "tor", "education"]
dependencies = []

[project.scripts]
ghostpath = "ghostpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
