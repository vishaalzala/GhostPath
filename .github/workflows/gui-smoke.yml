name: GhostPath Headless GUI Smoke

on:
  push:
    branches: [develop-v2]
  pull_request:
    branches: [develop-v2, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install GUI extra
        run: python -m pip install ".[gui]"
      - name: Run headless GUI shell test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/gui-smoke.py
