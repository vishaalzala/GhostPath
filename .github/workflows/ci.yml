name: GhostPath v2 CI

on:
  push:
    branches: [develop-v2]
  pull_request:
    branches: [develop-v2, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install --no-deps -e .
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline smoke checks
        run: |
          ghostpath --version
          ghostpath doctor --json
          ghostpath status --json
          ghostpath release-check --json
          ghostpath mac profiles --json
          ghostpath wifi config --file examples/router.json --json
          ghostpath defense demo --scenario surge --json
          ghostpath defense analyze --file examples/traffic.csv --json
          ghostpath defense eve --file examples/eve.jsonl --json
          ghostpath learn list --json
          ghostpath report create --output /tmp/ghostpath-report.json
          ghostpath report html --output /tmp/ghostpath-report.html
